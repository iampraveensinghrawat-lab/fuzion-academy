<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fuzion Academy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .logo-badge {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 900;
      box-shadow: 0 20px 40px rgba(168, 85, 247, 0.4);
      margin-bottom: 24px;
      animation: pulse 2s infinite ease-in-out;
    }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
    p { font-size: 13px; color: #cbd5e1; max-width: 280px; line-height: 1.5; margin-bottom: 28px; }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  </style>
</head>
<body>
  <div class="logo-badge">F</div>
  <h1>Fuzion Academy</h1>
  <p>Learn English. Speak Confidently. Grow Professionally.</p>
  <div class="spinner"></div>
  <script>
    const targetUrl = window.Capacitor?.getServerUrl() || '/auth';
    setTimeout(() => {
      window.location.href = targetUrl;
    }, 300);
  </script>
</body>
</html>
