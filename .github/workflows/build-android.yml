name: Build Fuzion Academy Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Packages
        run: npm ci

      - name: Build Next.js Production App
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://amzptluvdjihwluolufa.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_fRFkl6m5y3sPhusPtn5CzQ_LeKq94wI' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'AQ.Ab8RN6JxuPLktXD5fr9Dki5jO53hFg6x1HBnId4sDL0rUDOosw' }}

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Native Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: FuzionAcademy-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
